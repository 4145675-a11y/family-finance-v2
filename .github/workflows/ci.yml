name: CI

# Quality gates. Every step here runs a real command and fails the build on a real failure.
# Gates that are not yet implemented are NOT represented as passing steps — see docs/CI-GATES.md
# for the full gate table and the milestone in which each one becomes active (ADR-0003).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The framework must not phone home from a financial project's build (ADR-0010).
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install (reproducible, project-local)
        run: npm ci --ignore-scripts

      - name: Verify npm cache stays inside the repository
        run: |
          set -euo pipefail
          cache_path="$(npm config get cache)"
          echo "npm cache: ${cache_path}"
          case "${cache_path}" in
            "${GITHUB_WORKSPACE}"*) echo "cache is project-local" ;;
            *) echo "cache escapes the project root" >&2; exit 1 ;;
          esac

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run unit

      - name: Build
        run: npm run build

      - name: Built-shell contract (lang/dir/overflow/a11y)
        run: npm run check:shell

      - name: Client-secret boundary (no service role in the browser)
        run: npm run check:client-secrets

      # The RLS isolation suite needs a database and is therefore not run here yet.
      # It is NOT represented as a passing step. See docs/CI-GATES.md.

      - name: Forbidden-artifact scan
        run: npm run scan:forbidden

      - name: Traceability gate
        run: npm run check:traceability
