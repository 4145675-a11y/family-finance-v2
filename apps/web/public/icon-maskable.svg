<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="הכסף שלנו">
  <!--
    The maskable variant. A launcher may crop this to a circle, so the mark sits
    inside the safe area — the middle 80% — and the background fills the whole
    square. Cropping it should remove colour, never part of the roof.
  -->
  <rect width="512" height="512" fill="#1e4f73"/>
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path d="M118 222 256 114l138 108"/>
    <path d="M150 248v146a32 32 0 0 0 32 32h148a32 32 0 0 0 32-32V248"/>
    <circle cx="256" cy="318" r="56"/>
  </g>
</svg>
